name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 3am UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nord&border_color=38bdf8
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=nord&border_color=38bdf8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SDR_MIS pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Abdullah-SE-bit&repo=Smart-Disaster-Response-MIS&theme=nord&border_color=1BB56B
          path: profile/pin-smart-disaster-response-mis.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Ocean Route Navigation pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Abdullah-SE-bit&repo=Ocean-Route-Navigation&theme=nord&border_color=38bdf8
          path: profile/pin-ocean-route-navigation.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate BOGO pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Abdullah-SE-bit&repo=BOGO-v-2.0&theme=nord&border_color=38bdf8
          path: profile/pin-bogo.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FLAKE pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Abdullah-SE-bit&repo=Flake&theme=nord&border_color=38bdf8
          path: profile/pin-flake.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
